<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f472b6"/>
      <stop offset="50%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>
    <linearGradient id="cross" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.98"/>
      <stop offset="100%" stop-color="#fce7f3" stop-opacity="0.95"/>
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#a855f7" flood-opacity="0.3"/>
    </filter>
  </defs>
  <!-- Rounded square background -->
  <rect width="512" height="512" rx="116" fill="url(#bg)"/>
  <!-- Subtle inner highlight -->
  <rect x="0" y="0" width="512" height="256" rx="116" fill="white" opacity="0.06"/>
  <!-- Medical cross — vertical bar -->
  <rect x="208" y="108" width="96" height="296" rx="28" fill="url(#cross)" filter="url(#shadow)"/>
  <!-- Medical cross — horizontal bar -->
  <rect x="108" y="208" width="296" height="96" rx="28" fill="url(#cross)" filter="url(#shadow)"/>
  <!-- Small heart at center -->
  <circle cx="256" cy="256" r="22" fill="url(#bg)" opacity="0.6"/>
</svg>
